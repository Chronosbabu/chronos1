<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Abonnés de {{ profile_username }}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    /* ---------- GLOBAL ---------- */
    :root {
      --bg-color: #fafafa;
      --text-color: #262626;
      --border-color: #dbdbdb;
      --card-bg: #fff;
      --link-hover: #0095f6;
      --shadow-color: rgba(0,0,0,0.05);
      --button-bg: #0095f6;
      --button-hover: #00376b;
      --gradient-primary: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --gradient-secondary: linear-gradient(135deg, #4dabf7 0%, #0095f6 100%);
    }
    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --text-color: #e0e0e0;
      --border-color: #333;
      --card-bg: #262626;
      --link-hover: #4dabf7;
      --shadow-color: rgba(0,0,0,0.3);
      --button-bg: #4dabf7;
      --button-hover: #1c6dd0;
      --gradient-primary: linear-gradient(135deg, #c8501a 0%, #b34b26 25%, #a61e2e 50%, #991b54 75%, #8e146a 100%);
      --gradient-secondary: linear-gradient(135deg, #3a8cc7 0%, #0077c6 100%);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: inherit; }
    .main-container { max-width: 935px; margin: 0 auto; padding: 20px 20px 80px 20px; }
    /* ---------- HEADER ---------- */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 1px 2px var(--shadow-color);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-color);
      font-family: 'Lobster', cursive;
      letter-spacing: 1px;
      flex-shrink: 0;
    }
    .header-icons {
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: nowrap;
    }
    .header-icons a, .header-icons button {
      color: var(--text-color);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, transform 0.2s ease;
      position: relative;
      background: none;
      border: none;
      cursor: pointer;
    }
    .header-icons a:hover, .header-icons button:hover {
      color: var(--link-hover);
      transform: scale(1.1);
    }
    /* ---------- BOTTOM NAVIGATION BAR ---------- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
      z-index: 1000;
      box-shadow: 0 -1px 2px var(--shadow-color);
    }
    .bottom-nav a {
      color: var(--text-color);
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, transform 0.2s ease;
      position: relative;
    }
    .bottom-nav a:hover {
      color: var(--link-hover);
      transform: scale(1.1);
    }
    .bottom-nav a.active {
      color: var(--link-hover);
    }
    .message-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #ed4956;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 50%;
      line-height: 1;
      border: 2px solid var(--card-bg);
    }
    /* ---------- FOLLOWERS LIST ---------- */
    .followers-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px 0;
      overflow-y: auto;
      max-height: 80vh;
    }
    .follower-item {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      box-shadow: 0 2px 8px var(--shadow-color);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .follower-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 12px var(--shadow-color);
    }
    .follower-avatar, .follower-avatar-fallback {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.2rem;
      color: #fff;
      margin-right: 16px;
      transition: transform 0.2s ease;
    }
    .follower-avatar:hover, .follower-avatar-fallback:hover {
      transform: scale(1.05);
    }
    .follower-username {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-color);
      transition: color 0.2s ease;
    }
    .follower-username:hover {
      color: var(--link-hover);
    }
    .no-followers {
      font-size: 1rem;
      color: #6b7280;
      text-align: center;
      padding: 16px 0;
    }
    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 600px) {
      .main-container { padding: 16px 16px 70px 16px; }
      .logo { font-size: 1.5rem; }
      .header-icons { gap: 16px; }
      .header-icons a, .header-icons button { font-size: 1.3rem; }
      .bottom-nav { padding: 10px 0; }
      .bottom-nav a { font-size: 1.3rem; }
      .followers-list { padding: 16px 0; }
      .follower-item { padding: 10px 12px; }
      .follower-avatar, .follower-avatar-fallback { width: 40px; height: 40px; font-size: 1rem; margin-right: 12px; }
      .follower-username { font-size: 0.95rem; }
    }
  </style>
</head>
<body data-username="{{ current_username }}" data-theme="light">
  <div class="main-container">
    <header class="main-header">
      <h2 class="logo" style="display:none;">x-command</h2>
      <nav class="header-icons" style="display:none;">
        <a href="{{ url_for('index') }}" title="Accueil"><i class="fa-solid fa-house"></i></a>
        <a href="{{ url_for('add_post') }}" title="Nouvelle publication"><i class="fa-solid fa-circle-plus"></i></a>
        <a href="{{ url_for('profile', username=current_username) }}" title="Profil"><i class="fa-regular fa-user"></i></a>
        <a href="{{ url_for('conversations') }}" title="Messages" id="messages-link">
          <i class="fa-regular fa-message"></i>
          <span class="message-badge" id="unread-count" style="display:none;">0</span>
        </a>
      </nav>
    </header>
    <h1 style="text-align: center; margin: 20px 0;">Abonnés de @{{ profile_username }}</h1>
    <div class="followers-list">
      {% if followers|length == 0 %}
        <p class="no-followers">Aucun abonné pour l’instant.</p>
      {% else %}
        {% for follower in followers %}
          <a href="{{ url_for('profile', username=follower.username) }}" class="follower-item">
            {% if follower.avatar %}
              <img src="{{ url_for('avatar_file', filename=follower.avatar) }}?t={{ 'now'|timestamp }}" alt="avatar" class="follower-avatar" />
            {% else %}
              <div class="follower-avatar-fallback">{{ follower.username[:1]|upper }}</div>
            {% endif %}
            <span class="follower-username">@{{ follower.username }}</span>
          </a>
        {% endfor %}
      {% endif %}
    </div>
    <nav class="bottom-nav" style="display:none;">
      <a href="{{ url_for('notifications') }}" title="Notifications" id="notifications-link">
        <i class="fa-regular fa-bell"></i>
        <span class="message-badge" id="notifications-count" style="display:none;">0</span>
      </a>
      <a href="{{ url_for('search_users') }}" title="Rechercher"><i class="fa-solid fa-magnifying-glass"></i></a>
      <a href="{{ url_for('login') }}" title="Déconnexion" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i></a>
    </nav>
  </div>
  <script>
  const socket = io();
  // Theme toggle functionality
  const body = document.body;
  function setTheme(theme) {
    body.dataset.theme = theme;
    localStorage.setItem('theme', theme);
  }
  // Load saved theme or default to light
  const savedTheme = localStorage.getItem('theme') || 'light';
  setTheme(savedTheme);
  </script>
</body>
</html>
