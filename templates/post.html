<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Publier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<!-- 🔥 RETOUR -->
<a href="/" class="btn btn-secondary mb-3">⬅ Retour</a>

<h2>Publier un produit</h2>

<form id="form">

<input class="form-control mb-2" id="name" placeholder="Nom" required>
<input class="form-control mb-2" id="price" placeholder="Prix" required>
<input class="form-control mb-2" id="shipping_fee" placeholder="Livraison" required>
<input class="form-control mb-2" id="whatsapp" placeholder="243..." required>

<select id="type" class="form-control mb-2" required>
<option value="">Choisir un type</option>
<option value="FAST FOOD">FAST FOOD</option>
<option value="TO PREPARE">TO PREPARE</option>
</select>

<input type="file" id="image" class="form-control mb-2" required>

<textarea id="description" class="form-control mb-2" placeholder="Description" required></textarea>

<button class="btn btn-success w-100">Publier</button>

</form>

<script>
document.getElementById('form').addEventListener('submit', async(e)=>{
e.preventDefault();

let fd=new FormData();

fd.append('name', document.getElementById('name').value);
fd.append('price', document.getElementById('price').value);
fd.append('shipping_fee', document.getElementById('shipping_fee').value);
fd.append('description', document.getElementById('description').value);
fd.append('whatsapp', document.getElementById('whatsapp').value);
fd.append('city', document.getElementById('type').value);
fd.append('image', document.getElementById('image').files[0]);

try{
let res=await fetch('/publish',{method:'POST',body:fd});
let data=await res.json();

if(res.ok){
alert("✅ Produit publié !");
window.location.href = "/";
}else{
alert("❌ " + data.error);
}

}catch(e){
alert("Erreur connexion serveur");
}
});
</script>

</body>
</html>
